version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_soar
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Casablanca}
      - TZ=${GENERIC_TIMEZONE:-Africa/Casablanca}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n

  dfir-iris:
    image: dfiriris/iris-web:v2.4.27
    container_name: dfir_iris
    restart: always
    ports:
      - "443:8443"
      - "80:8000"
    environment:
      - IRIS_ADMIN_USER=admin
      - IRIS_ADMIN_PASSPHRASE=admin
    volumes:
      - iris_data:/data

volumes:
  n8n_data:
    name: n8n_volume
  iris_data:
    name: iris_volume
